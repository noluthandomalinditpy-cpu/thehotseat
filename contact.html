<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | The Hot Seat by N</title>
    <meta
      name="description"
      content="Luxury salon gallery featuring nails, hair, make-up and lash transformations from The Hot Seat by N."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <div class="page-head">
        <div class="wrap">
          <p class="eyebrow">Our portfolio</p>
          <h1>Gallery</h1>
          <p class="lead">Recent looks, luxe finishes and client transformations.</p>
        </div>
      </div>

      <section>
        <div class="wrap">
          <div class="tabs" id="gal-tabs" role="group" aria-label="Filter gallery"></div>
          <div class="gallery-grid" id="gallery"></div>
        </div>
      </section>

      <dialog id="lightbox">
        <img alt="Expanded beauty photo" />
      </dialog>
    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
